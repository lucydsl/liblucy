name: Releases

on: 
  push:
    tags:
    - '*'

jobs:
  # The GitHub release, with lucyc for Linux and macOS, which the website's
  # install.sh downloads. One job makes it, as a draft; each build adds its
  # binary; and it is published once both are there, so nobody downloads
  # from a release that is missing one.
  #
  # When each build made the release itself they raced, and the one that
  # lost failed with "already exists", leaving the release with one binary.
  #
  # Each step can be run again: the draft is only made if it isn't there,
  # and an upload replaces what an earlier run uploaded.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Make the draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""

  build:
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One build failing shouldn't stop the other's binary being uploaded.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: mac
    steps:
    - uses: actions/checkout@v7
    - name: build
      run: |
        make bin/lucyc
        cd bin && tar -zcvf ../${{ matrix.name }}.tar.gz lucyc && cd -
    - name: Add the binary to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.name }}.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Publishes @lucy/liblucy to npm with trusted publishing: npm trusts this
  # workflow file in this repository (set on the package's page at npmjs.com),
  # so there is no token to keep. That needs the id-token permission and
  # npm 11.5.1 or later.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - name: Update npm
      run: npm install -g npm@latest
    - name: Check the tag is the package's version
      run: |
        version="$(jq -r .version package.json)"
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "The tag is $GITHUB_REF_NAME, but package.json says $version" >&2
          exit 1
        fi
    - name: Cache wasi-sdk
      uses: actions/cache@v6
      with:
        path: ~/.cache/wasi-sdk
        key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/get_wasi_sdk') }}
    - name: Get wasi-sdk
      run: scripts/get_wasi_sdk
    - name: Install colordiff
      run: sudo apt-get install colordiff
    - name: Build and test
      run: |
        make WERROR=1 all
        make test
    - name: Publish
      run: npm publish --access public
