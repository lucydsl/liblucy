name: Lucy CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    # The wasm build's toolchain. scripts/get_wasi_sdk pins the release and
    # its checksum, so the cache is keyed on that script.
    - name: Cache wasi-sdk
      uses: actions/cache@v6
      with:
        path: ~/.cache/wasi-sdk
        key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/get_wasi_sdk') }}
    - name: Get wasi-sdk
      run: scripts/get_wasi_sdk

    - name: Install colordiff
      run: sudo apt-get install colordiff

    - name: make test
      run: |
        make WERROR=1 all
        make test

  sanitize:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: make test-sanitize
      run: make WERROR=1 test-sanitize
